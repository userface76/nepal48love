name = "nepal48love"
pages_build_output_dir = "public"
compatibility_date = "2026-08-01"

# ─────────────────────────────────────────────────────────────
# D1 데이터베이스 바인딩
#   1) npx wrangler d1 create nepal48love
#   2) 출력된 database_id 를 아래에 붙여넣기
#   3) npx wrangler d1 execute nepal48love --file=./schema.sql --remote
# ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "nepal48love"
database_id = "feefee01-215a-4c5e-b4da-65a8fa0f5126"

[vars]
# 공개 설정값 (민감정보 아님)
CAMPAIGN_PHASE   = "proposal"   # proposal | waitlist | pilot | closed
ENTRY_FEE        = "16000"
RELIEF_PER_PERSON = "2000"
PILOT_TARGET     = "300"
BANK_NAME        = "○○은행"
BANK_ACCOUNT     = "000-000000-00-000"
BANK_HOLDER      = "주식회사 메타매직"

# ─────────────────────────────────────────────────────────────
# 비밀값은 절대 이 파일에 쓰지 말고 secret 으로 등록하세요.
#   npx wrangler pages secret put ADMIN_TOKEN
#   npx wrangler pages secret put HASH_SALT
#   npx wrangler pages secret put TURNSTILE_SECRET
# ─────────────────────────────────────────────────────────────
